server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /patients {
        proxy_pass http://api:8000;
    }
    location /qa {
        proxy_pass http://api:8000;
    }
    location /health {
        proxy_pass http://api:8000;
    }
    location /meta {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
